<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#041E42" />
    <meta name="description" content="Interactive East Tennessee State University campus map." />
    <title>ETSU Campus Map</title>
    <style>
      html, body, #root { margin: 0; min-height: 100%; }
      body { background: #f5f7fa; }
      .boot-screen { min-height: 100vh; display: grid; place-items: center; font-family: Arial, sans-serif; color: #041e42; }
      .boot-card { text-align: center; padding: 32px; }
      .boot-card strong { display: block; font-size: 24px; margin-bottom: 8px; }
      .boot-card span { color: #687789; font-size: 14px; }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-screen">
        <div class="boot-card">
          <strong>ETSU Campus Map</strong>
          <span>Loading interactive map…</span>
        </div>
      </div>
    </div>
    <script type="module" src="./src/main.jsx"></script>
  </body>
</html>
